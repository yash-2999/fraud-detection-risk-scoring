<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Fraud Detection and Risk Scoring System banner" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="0.55" stop-color="#14213d"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>

  <!-- decorative transaction network -->
  <g stroke="#38bdf8" stroke-opacity="0.35" stroke-width="1.5" fill="none">
    <path d="M830 70 L920 130 L1010 90 L1100 160 L1010 230 L920 200 L830 250"/>
    <path d="M920 130 L920 200"/>
    <path d="M1010 90 L1010 230"/>
  </g>
  <g fill="#38bdf8" fill-opacity="0.8">
    <circle cx="830" cy="70" r="6"/><circle cx="920" cy="130" r="6"/>
    <circle cx="1010" cy="90" r="6"/><circle cx="1010" cy="230" r="6"/>
    <circle cx="920" cy="200" r="6"/><circle cx="830" cy="250" r="6"/>
  </g>
  <circle cx="1100" cy="160" r="16" fill="#f43f5e" fill-opacity="0.25"/>
  <circle cx="1100" cy="160" r="8" fill="#f43f5e"/>
  <text x="1100" y="198" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fda4af">flagged</text>

  <!-- title -->
  <rect x="60" y="62" width="64" height="5" rx="2.5" fill="url(#accent)"/>
  <text x="60" y="124" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="#ffffff">Fraud Detection</text>
  <text x="60" y="176" font-family="Arial, Helvetica, sans-serif" font-size="46" font-weight="700" fill="url(#accent)">&amp; Risk Scoring System</text>
  <text x="60" y="214" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cbd5e1">Credit-card transaction risk estimation with chronological evaluation</text>

  <!-- tech chips -->
  <g font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#e2e8f0">
    <rect x="60" y="244" width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="99" y="264" text-anchor="middle">Python</text>
    <rect x="148" y="244" width="110" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="203" y="264" text-anchor="middle">Scikit-learn</text>
    <rect x="268" y="244" width="98" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="317" y="264" text-anchor="middle">Streamlit</text>
    <rect x="376" y="244" width="78" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="415" y="264" text-anchor="middle">Plotly</text>
    <rect x="464" y="244" width="82" height="30" rx="15" fill="#ffffff" fill-opacity="0.1"/>
    <text x="505" y="264" text-anchor="middle">SQLite</text>
  </g>
</svg>
