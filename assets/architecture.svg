<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-label="System architecture of the fraud detection pipeline" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#94a3b8"/>
    </marker>
  </defs>
  <style>
    .t{font-family:Arial,Helvetica,sans-serif;fill:#f1f5f9}
    .h{font-size:17px;font-weight:700}
    .s{font-size:13px;fill:#cbd5e1}
    .m{font-size:12px;fill:#7dd3fc;font-family:Consolas,Menlo,monospace}
    .box{fill:#1e293b;stroke-width:2}
    .ln{stroke:#94a3b8;stroke-width:2;fill:none;marker-end:url(#arrow)}
  </style>

  <rect width="1200" height="760" fill="#0f172a"/>
  <text x="40" y="50" class="t" font-size="26" font-weight="700">System Architecture</text>
  <text x="40" y="74" class="t s">Data → chronological split → leakage-aware pipeline → model selection → held-out test → dashboard</text>

  <!-- Row 1 -->
  <rect class="box" x="40" y="100" width="250" height="90" rx="12" stroke="#38bdf8"/>
  <text x="58" y="127" class="t h">Raw dataset</text>
  <text x="58" y="148" class="m">data/raw/creditcard.csv</text>
  <text x="58" y="168" class="t s">284,807 rows · 492 frauds</text>

  <rect class="box" x="330" y="100" width="250" height="90" rx="12" stroke="#38bdf8"/>
  <text x="348" y="127" class="t h">Chronological split</text>
  <text x="348" y="148" class="m">split.py · data.py</text>
  <text x="348" y="168" class="t s">Sort by Time · 60 / 20 / 20</text>

  <rect class="box" x="620" y="100" width="250" height="90" rx="12" stroke="#a78bfa"/>
  <text x="638" y="127" class="t h">Preprocessing pipeline</text>
  <text x="638" y="148" class="m">preprocessing.py</text>
  <text x="638" y="168" class="t s">Impute + scale · fit on train only</text>

  <rect class="box" x="910" y="100" width="250" height="90" rx="12" stroke="#a78bfa"/>
  <text x="928" y="127" class="t h">Model comparison</text>
  <text x="928" y="148" class="m">train.py</text>
  <text x="928" y="168" class="t s">LR · Random Forest · Decision Tree</text>

  <path class="ln" d="M290 145H326"/>
  <path class="ln" d="M580 145H616"/>
  <path class="ln" d="M870 145H906"/>

  <!-- Row 2 -->
  <rect class="box" x="910" y="250" width="250" height="90" rx="12" stroke="#34d399"/>
  <text x="928" y="277" class="t h">Selected model</text>
  <text x="928" y="298" class="m">models/model_metadata.json</text>
  <text x="928" y="318" class="t s">Logistic Regression (val PR-AUC)</text>

  <rect class="box" x="620" y="250" width="250" height="90" rx="12" stroke="#34d399"/>
  <text x="638" y="277" class="t h">Test evaluation</text>
  <text x="638" y="298" class="m">evaluate.py</text>
  <text x="638" y="318" class="t s">Held-out 20% · evaluated once</text>

  <rect class="box" x="330" y="250" width="250" height="90" rx="12" stroke="#34d399"/>
  <text x="348" y="277" class="t h">Reports</text>
  <text x="348" y="298" class="m">reports/ · metrics.json</text>
  <text x="348" y="318" class="t s">Metrics, figures, comparison</text>

  <path class="ln" d="M1035 190V246"/>
  <path class="ln" d="M910 295H874"/>
  <path class="ln" d="M620 295H584"/>

  <!-- Row 3 -->
  <rect class="box" x="40" y="400" width="250" height="90" rx="12" stroke="#fbbf24"/>
  <text x="58" y="427" class="t h">SQLite analytics</text>
  <text x="58" y="448" class="m">database.py · sql_analytics.py</text>
  <text x="58" y="468" class="t s">schema.sql · SQL queries</text>

  <rect class="box" x="620" y="400" width="250" height="90" rx="12" stroke="#fbbf24"/>
  <text x="638" y="427" class="t h">Scoring layer</text>
  <text x="638" y="448" class="m">predict.py · risk_scoring.py</text>
  <text x="638" y="468" class="t s">Transaction risk scoring</text>

  <rect class="box" x="910" y="400" width="250" height="90" rx="12" stroke="#64748b" stroke-dasharray="6 5"/>
  <text x="928" y="427" class="t h">Configuration</text>
  <text x="928" y="448" class="m">configs/config.yaml · config.py</text>
  <text x="928" y="468" class="t s">Project settings</text>

  <path class="ln" d="M165 190V396"/>
  <path class="ln" d="M1100 340V380H800V396" stroke-dasharray="0"/>

  <!-- Row 4 -->
  <rect class="box" x="40" y="560" width="1120" height="150" rx="14" stroke="#f472b6"/>
  <text x="62" y="590" class="t h">Streamlit dashboard</text>
  <text x="62" y="611" class="m">app/streamlit_app.py</text>
  <g class="t s">
    <text x="62" y="648">1. Executive Overview</text>
    <text x="62" y="674">2. Data Explorer</text>
    <text x="342" y="648">3. Model Performance</text>
    <text x="342" y="674">4. Transaction Scoring</text>
    <text x="662" y="648">5. Batch Analysis</text>
    <text x="662" y="674">6. Risk Analytics</text>
    <text x="922" y="648">7. Threshold Simulator</text>
    <text x="922" y="674">8. SQL Analytics</text>
  </g>

  <path class="ln" d="M165 490V556"/>
  <path class="ln" d="M745 490V556"/>
  <path class="ln" d="M455 340V556"/>

  <!-- legend -->
  <g class="t s">
    <rect x="40" y="730" width="12" height="12" rx="3" fill="#38bdf8"/><text x="60" y="741">Data</text>
    <rect x="120" y="730" width="12" height="12" rx="3" fill="#a78bfa"/><text x="140" y="741">Modeling</text>
    <rect x="230" y="730" width="12" height="12" rx="3" fill="#34d399"/><text x="250" y="741">Evaluation</text>
    <rect x="350" y="730" width="12" height="12" rx="3" fill="#fbbf24"/><text x="370" y="741">Serving</text>
    <rect x="450" y="730" width="12" height="12" rx="3" fill="#f472b6"/><text x="470" y="741">Application</text>
  </g>
</svg>
